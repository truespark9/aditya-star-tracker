<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aditya Star Points Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#002F6C">

  <!-- Tailwind CSS & Canvas Confetti -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind Custom Palette (Amway Blue & Red) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amway: {
              navy: '#06162e',
              deepBlue: '#002F6C',
              royalBlue: '#0047AB',
              lightBlue: '#E8F1FC',
              crimson: '#C8102E',
              brightRed: '#E02B20',
              gold: '#F59E0B'
            }
          }
        }
      }
    }
  </script>

  <style>
    @keyframes gold-pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.6)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 22px rgba(245, 158, 11, 0.9)); }
    }
    .high-score-glow { animation: gold-pulse 2.5s infinite ease-in-out; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-amway-navy text-slate-100 min-h-screen font-sans selection:bg-amway-crimson selection:text-white">

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const REASONS = [
  { id: 'pos_brush_twice', type: 'pos', en: 'Brushing teeth twice', hi: 'दिन में दो बार ब्रश करना', pts: 5 },
  { id: 'pos_listen_first', type: 'pos', en: 'Listening to Mumma at the first go', hi: 'एक ही बार में मम्मा की बात सुनना', pts: 10 },
  { id: 'pos_homework', type: 'pos', en: 'Doing homework on the same day independently', hi: 'होमवर्क उसी दिन खुद से पूरा करना', pts: 15 },
  { id: 'pos_bath_time', type: 'pos', en: 'Taking bath on time without reminders', hi: 'समय पर बिना कहे नहाना', pts: 5 },
  { id: 'pos_room_clean', type: 'pos', en: 'Keeping room & books neat and tidy', hi: 'कमरा और किताबें साफ रखना', pts: 10 },
  { id: 'pos_screen_off', type: 'pos', en: 'Putting phone/screen away immediately', hi: 'कहे जाने पर तुरंत फोन/स्क्रीन बंद करना', pts: 10 },
  { id: 'pos_eating_meals', type: 'pos', en: 'Finishing meals properly without fuss', hi: 'बिना नखरे किए पूरा खाना खत्म करना', pts: 10 },
  { id: 'pos_help_house', type: 'pos', en: 'Helping Mumma/Papa with household tasks', hi: 'घर के कामों में मम्मा/पापा की मदद करना', pts: 15 },
  { id: 'neg_misbehave', type: 'neg', en: 'Misbehaving or arguing with Mumma', hi: 'मम्मा से गलत तरीके से बात करना या बहस करना', pts: -10 },
  { id: 'neg_not_listen', type: 'neg', en: 'Not listening at first go', hi: 'पहली बार में बात न सुनना', pts: -5 },
  { id: 'neg_skip_bath', type: 'neg', en: 'Making excuses or delaying bath', hi: 'नहाने में आनाकानी करना या समय लगाना', pts: -5 },
  { id: 'neg_screen_delay', type: 'neg', en: 'Refusing to turn off TV/mobile on time', hi: 'स्क्रीन या फोन बंद करने में आनाकानी करना', pts: -10 },
  { id: 'neg_mess', type: 'neg', en: 'Leaving school bag/shoes/clothes scattered', hi: 'बैग, जूते या कपड़े इधर-उधर फैलाना', pts: -5 }
];

const playTone = (type) => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if (type === 'pos') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(460, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(920, ctx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } else if (type === 'milestone') {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
        o.start(ctx.currentTime + idx * 0.1);
        o.stop(ctx.currentTime + idx * 0.1 + 0.3);
      });
    } else if (type === 'neg') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(260, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    }
  } catch (e) {
    console.log(e);
  }
};

function App() {
  const [role, setRole] = useState(() => localStorage.getItem('user_role') || 'papa');
  const [currentScore, setCurrentScore] = useState(() => parseInt(localStorage.getItem('aditya_curr_pts') || '0', 10));
  const [highestScore, setHighestScore] = useState(() => parseInt(localStorage.getItem('aditya_high_pts') || '0', 10));
  const [history, setHistory] = useState(() => JSON.parse(localStorage.getItem('aditya_pts_hist') || '[]'));
  
  const [customPts, setCustomPts] = useState('');
  const [notification, setNotification] = useState(null);

  useEffect(() => {
    localStorage.setItem('user_role', role);
  }, [role]);

  useEffect(() => {
    localStorage.setItem('aditya_curr_pts', currentScore);
    localStorage.setItem('aditya_high_pts', highestScore);
    localStorage.setItem('aditya_pts_hist', JSON.stringify(history));
  }, [currentScore, highestScore, history]);

  const showToast = (msg, type = 'info') => {
    setNotification({ msg, type });
    setTimeout(() => setNotification(null), 4000);
  };

  const handleApplyPoints = (ptsToAdd, reasonObj = null) => {
    if (ptsToAdd === 0 || isNaN(ptsToAdd)) return;

    const oldScore = currentScore;
    const newScore = Math.max(0, oldScore + ptsToAdd);
    const newHighest = Math.max(highestScore, newScore);

    setCurrentScore(newScore);
    setHighestScore(newHighest);

    const logEntry = {
      id: Date.now(),
      pts: ptsToAdd,
      enReason: reasonObj ? reasonObj.en : 'Custom Points',
      hiReason: reasonObj ? reasonObj.hi : 'अतिरिक्त अंक',
      giver: role === 'ruby' ? 'Mumma' : 'Papa',
      date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' })
    };

    setHistory(prev => [logEntry, ...prev]);

    const hit100 = oldScore < 100 && newScore >= 100;
    const hit50Step = (newScore > 100) && (Math.floor(newScore / 50) > Math.floor(oldScore / 50));
    const hitRecord = newScore > highestScore && oldScore <= highestScore && newScore > 5;

    if (ptsToAdd > 0) {
      if (hit100 || hit50Step || hitRecord) {
        playTone('milestone');
        confetti({ particleCount: 160, spread: 80, origin: { y: 0.6 } });
        const milestoneMsg = hitRecord 
          ? `🏆 ALL-TIME HIGH SCORE! Aditya reached ${newScore} points!`
          : `🎉 MILESTONE! Aditya unlocked ${newScore} points!`;
        showToast(milestoneMsg, 'milestone');
      } else {
        playTone('pos');
        confetti({ particleCount: 45, spread: 50, origin: { y: 0.7 } });
        const reasonLabel = reasonObj ? (role === 'ruby' ? reasonObj.hi : reasonObj.en) : '';
        showToast(`+${ptsToAdd} points awarded! ${reasonLabel}`, 'pos');
      }
    } else {
      playTone('neg');
      const reasonLabel = reasonObj ? (role === 'ruby' ? reasonObj.hi : reasonObj.en) : '';
      showToast(`${ptsToAdd} points deducted. ${reasonLabel}`, 'neg');
    }

    setCustomPts('');
  };

  const handleMonthEndReset = () => {
    if (confirm("Reset monthly balance to 0 for month end? The highest record will remain safe.")) {
      setCurrentScore(0);
      showToast("Month-end reset done! All-time record preserved.", 'info');
    }
  };

  return (
    <div className="max-w-md mx-auto min-h-screen bg-amway-navy flex flex-col justify-between shadow-2xl relative pb-8 border-x border-amway-deepBlue/40">
      
      {/* Toast Alert */}
      {notification && (
        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl shadow-2xl font-bold flex items-center gap-3 text-xs md:text-sm animate-bounce border ${
          notification.type === 'milestone' ? 'bg-amway-gold text-slate-950 border-amber-300' :
          notification.type === 'pos' ? 'bg-amway-deepBlue text-white border-blue-400' :
          notification.type === 'neg' ? 'bg-amway-crimson text-white border-red-300' : 'bg-slate-800 text-white border-slate-600'
        }`}>
          <span>{notification.type === 'milestone' ? '🏆' : notification.type === 'pos' ? '⭐' : '⚠️'}</span>
          <span>{notification.msg}</span>
        </div>
      )}

      {/* Header with Amway Blue Branding */}
      <header className="p-4 bg-gradient-to-r from-amway-deepBlue to-amway-navy border-b border-amway-deepBlue/60 flex justify-between items-center shadow-md">
        <div>
          <div className="flex items-center gap-1.5">
            <span className="w-2.5 h-2.5 rounded-full bg-amway-crimson inline-block"></span>
            <h1 className="text-xs font-bold text-slate-300 tracking-wider uppercase">Star Points Tracker</h1>
          </div>
          <span className="text-sm font-extrabold text-white">
            {role === 'papa' ? 'Papa (Admin)' : role === 'ruby' ? 'Mumma (रुबी)' : 'Aditya (Champion)'}
          </span>
        </div>

        {/* Role Switcher */}
        <div className="flex bg-amway-navy/90 p-1 rounded-xl text-xs gap-1 border border-amway-deepBlue">
          <button 
            onClick={() => setRole('papa')} 
            className={`px-2.5 py-1.5 rounded-lg font-semibold transition ${role === 'papa' ? 'bg-amway-deepBlue text-white border border-blue-400/30' : 'text-slate-400'}`}>
            Papa
          </button>
          <button 
            onClick={() => setRole('ruby')} 
            className={`px-2.5 py-1.5 rounded-lg font-semibold transition ${role === 'ruby' ? 'bg-amway-crimson text-white shadow' : 'text-slate-400'}`}>
            Mumma
          </button>
          <button 
            onClick={() => setRole('aditya')} 
            className={`px-2.5 py-1.5 rounded-lg font-semibold transition ${role === 'aditya' ? 'bg-amway-gold text-slate-950 font-bold' : 'text-slate-400'}`}>
            Aditya
          </button>
        </div>
      </header>

      {/* Main Content Area */}
      <main className="p-4 space-y-5 flex-1">

        {/* Score Boards: High Record & Current Points */}
        <section className="grid grid-cols-2 gap-3.5">
          <div className="bg-gradient-to-b from-amway-deepBlue/50 to-amway-navy p-4 rounded-2xl border border-amway-gold/40 flex flex-col items-center text-center shadow-lg relative">
            <span className="text-3xl high-score-glow mb-1">🏆</span>
            <p className="text-[11px] font-bold text-amway-gold uppercase tracking-wider">
              {role === 'ruby' ? 'सर्वोच्च रिकॉर्ड' : 'All-Time Record'}
            </p>
            <p className="text-3xl font-black text-amber-300 mt-0.5">{highestScore}</p>
            <span className="text-[10px] text-slate-400 mt-1">{role === 'ruby' ? 'नया रिकॉर्ड बनाएं!' : 'Target to beat!'}</span>
          </div>

          <div className="bg-gradient-to-b from-amway-deepBlue to-amway-navy p-4 rounded-2xl border border-blue-500/40 flex flex-col items-center text-center shadow-lg">
            <span className="text-3xl mb-1 text-white">⭐</span>
            <p className="text-[11px] font-bold text-blue-200 uppercase tracking-wider">
              {role === 'ruby' ? 'इस महीने के अंक' : 'Current Points'}
            </p>
            <p className="text-3xl font-black text-white mt-0.5">{currentScore}</p>
            <span className="text-[10px] text-slate-300 mt-1">{role === 'ruby' ? 'माह के अंत तक' : 'Monthly score'}</span>
          </div>
        </section>

        {/* Milestone Progress Bar with Red-to-Gold Accent */}
        <section className="bg-slate-900/80 p-4 rounded-2xl border border-amway-deepBlue/80 space-y-2 shadow-inner">
          <div className="flex justify-between text-xs font-semibold">
            <span className="text-slate-300">
              {role === 'ruby' ? 'अगला पड़ाव (माइलस्टोन)' : 'Next Milestone'}
            </span>
            <span className="text-amway-gold font-bold">
              {currentScore < 100 ? `${currentScore} / 100 Pts` : `${currentScore} / ${Math.ceil((currentScore + 1) / 50) * 50} Pts`}
            </span>
          </div>
          <div className="w-full bg-slate-950 rounded-full h-3.5 overflow-hidden p-0.5 border border-slate-700">
            <div 
              className="bg-gradient-to-r from-amway-deepBlue via-amway-crimson to-amway-gold h-full rounded-full transition-all duration-700"
              style={{
                width: `${Math.min(100, currentScore < 100 ? (currentScore / 100) * 100 : ((currentScore % 50) / 50) * 100)}%`
              }}
            ></div>
          </div>
          <p className="text-[11px] text-slate-400 text-center italic">
            {currentScore < 100 ? 'Reach 100 points to trigger Century Celebration!' : 'Celebration triggers every 50 points!'}
          </p>
        </section>

        {/* Parent Controls (Papa & Mumma) */}
        {role !== 'aditya' ? (
          <section className="bg-slate-900/90 p-4 rounded-3xl border border-amway-deepBlue space-y-4 shadow-xl">
            <div className="flex justify-between items-center">
              <h2 className="text-xs font-bold text-white flex items-center gap-1.5 uppercase tracking-wide">
                <span className="w-2 h-2 rounded-full bg-amway-crimson"></span>
                {role === 'ruby' ? 'अंक जोड़ें या घटाएं' : 'Manage Points'}
              </h2>
              {role === 'papa' && (
                <button 
                  onClick={handleMonthEndReset}
                  className="text-[10px] font-bold bg-amway-crimson/20 hover:bg-amway-crimson text-red-300 hover:text-white px-2.5 py-1 rounded-lg border border-amway-crimson/40 transition">
                  Month-End Reset
                </button>
              )}
            </div>

            {/* Quick Point Buttons */}
            <div className="grid grid-cols-4 gap-2 text-xs font-black">
              <button onClick={() => handleApplyPoints(5)} className="bg-amway-deepBlue hover:bg-amway-royalBlue text-white py-2 rounded-xl border border-blue-400/40 shadow transition">+5</button>
              <button onClick={() => handleApplyPoints(10)} className="bg-amway-deepBlue hover:bg-amway-royalBlue text-white py-2 rounded-xl border border-blue-400/40 shadow transition">+10</button>
              <button onClick={() => handleApplyPoints(-5)} className="bg-amway-crimson/30 hover:bg-amway-crimson text-red-200 py-2 rounded-xl border border-amway-crimson/50 shadow transition">-5</button>
              <button onClick={() => handleApplyPoints(-10)} className="bg-amway-crimson/30 hover:bg-amway-crimson text-red-200 py-2 rounded-xl border border-amway-crimson/50 shadow transition">-10</button>
            </div>

            {/* Custom Input */}
            <div className="flex gap-2">
              <input 
                type="number"
                placeholder={role === 'ruby' ? 'अंक दर्ज करें (+ या -)' : 'Custom points (+ or -)'}
                value={customPts}
                onChange={(e) => setCustomPts(e.target.value)}
                className="bg-slate-950 border border-amway-deepBlue rounded-xl px-3 py-2 text-xs text-white w-full focus:outline-none focus:border-amway-crimson"
              />
              <button 
                onClick={() => {
                  const val = parseInt(customPts, 10);
                  if (!isNaN(val)) handleApplyPoints(val, null);
                }}
                className="bg-amway-crimson hover:bg-amway-brightRed text-white font-bold text-xs px-4 rounded-xl shrink-0 transition shadow">
                {role === 'ruby' ? 'लागू करें' : 'Apply'}
              </button>
            </div>

            {/* Bilingual Reasons List */}
            <div className="space-y-2">
              <label className="text-[11px] font-semibold text-slate-400">
                {role === 'ruby' ? 'कारण चुनें (वैकल्पिक / Optional):' : 'Select Reason (Optional):'}
              </label>
              <div className="max-h-48 overflow-y-auto space-y-1.5 pr-1 text-xs">
                {REASONS.map((r) => (
                  <button
                    key={r.id}
                    onClick={() => handleApplyPoints(r.pts, r)}
                    className={`w-full text-left p-2.5 rounded-xl border flex items-center justify-between transition ${
                      r.type === 'pos' 
                        ? 'bg-amway-deepBlue/20 border-amway-deepBlue/50 hover:bg-amway-deepBlue/40 text-blue-100' 
                        : 'bg-amway-crimson/15 border-amway-crimson/40 hover:bg-amway-crimson/30 text-red-100'
                    }`}
                  >
                    <span className="font-medium pr-2">
                      {role === 'ruby' ? r.hi : r.en}
                    </span>
                    <span className={`font-black shrink-0 ${r.type === 'pos' ? 'text-blue-300' : 'text-red-400'}`}>
                      {r.pts > 0 ? `+${r.pts}` : r.pts}
                    </span>
                  </button>
                ))}
              </div>
            </div>
          </section>
        ) : (
          /* Aditya's Champion Banner */
          <div className="bg-gradient-to-r from-amway-deepBlue via-amway-navy to-amway-crimson/40 border border-amway-gold/50 p-5 rounded-3xl text-center space-y-2 shadow-2xl">
            <span className="text-4xl">🚀</span>
            <h3 className="font-black text-base text-white uppercase tracking-wide">You Are A Champion, Aditya!</h3>
            <p className="text-xs text-slate-200 leading-relaxed">
              Every good habit helps you reach the next 50-point milestone and beat your all-time high score of <strong className="text-amway-gold font-extrabold">{highestScore} points</strong>!
            </p>
          </div>
        )}

        {/* History Log */}
        <section className="space-y-2.5">
          <h3 className="text-[11px] font-bold uppercase tracking-wider text-slate-400">
            {role === 'ruby' ? 'हालिया गतिविधियां (इतिहास)' : 'Recent Points History'}
          </h3>
          <div className="space-y-2">
            {history.length === 0 ? (
              <p className="text-xs text-slate-400 text-center py-5 bg-slate-900/60 rounded-2xl border border-amway-deepBlue/40">
                {role === 'ruby' ? 'अभी कोई अंक दर्ज नहीं किए गए हैं।' : 'No activity logged yet this month.'}
              </p>
            ) : (
              history.slice(0, 10).map((item) => (
                <div 
                  key={item.id} 
                  className="bg-slate-900/70 p-3 rounded-2xl border border-amway-deepBlue/50 flex justify-between items-center text-xs"
                >
                  <div className="space-y-0.5">
                    <p className="font-semibold text-slate-200">
                      {role === 'ruby' ? item.hiReason : item.enReason}
                    </p>
                    <p className="text-[10px] text-slate-400">
                      By {item.giver} • {item.date}
                    </p>
                  </div>
                  <span className={`text-xs font-black px-2.5 py-1 rounded-xl ${
                    item.pts > 0 ? 'bg-amway-deepBlue text-blue-200 border border-blue-400/40' : 'bg-amway-crimson/30 text-red-300 border border-amway-crimson/50'
                  }`}>
                    {item.pts > 0 ? `+${item.pts}` : item.pts}
                  </span>
                </div>
              ))
            )}
          </div>
        </section>

      </main>

      <footer className="text-center text-[10px] text-slate-400 pt-3 border-t border-amway-deepBlue/40">
        Aditya Star Points Tracker • Amway Heritage Edition
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
  });
}
</script>
</body>
</html>
